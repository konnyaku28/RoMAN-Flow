[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-flow"
version = "0.1.0"
description = "PyTorch offline robot learning for LIBERO and RoboMimic MH"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["agents*", "envs*", "utils*"]
